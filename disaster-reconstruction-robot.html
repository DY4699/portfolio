<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="多功能灾后重建机器人：成图大赛项目作品展示。"><title>多功能灾后重建机器人 · 丁阳作品集</title><link rel="stylesheet" href="style.css?v=5"><link rel="stylesheet" href="home.css?v=5"><link rel="stylesheet" href="contest.css?v=5"><link rel="stylesheet" href="portfolio.css?v=2"></head><body class="project-page contest-page"><header class="header"><a class="identity" href="index.html" aria-label="返回作品集首页">丁阳<span>← 首页</span></a><nav aria-label="项目导航"><a href="#mechanisms">机构设计</a><a href="#verification">局部分析</a></nav></header><main id="top"><section class="contest-intro section-wrap"><div><h1>多功能灾后<br>重建机器人</h1><p class="intro">面向灾后探测与清障作业的机器人概念方案，采用腿履式底盘、剪叉升降平台和多功能作业机构。</p><p class="contest-status">成图大赛 / 数字化创新设计赛道</p></div><figure class="contest-cover"><button class="image-button" data-image="assets__contest__robot-whole.jpg" data-caption="机器人整机三维模型" aria-label="放大机器人整机三维模型"><img src="assets__contest__robot-whole.jpg" alt="机器人整机三维模型" loading="lazy"></button><figcaption>机器人整机三维模型</figcaption></figure></section><section id="mechanisms" class="contest-band"><div class="contest-block section-wrap"><div class="contest-heading"><div><h2>主要机构设计</h2></div><p>通过底盘、升降平台、机械臂和挖掘机构的布局，规划移动与作业功能。</p></div><div class="contest-grid"><figure class="contest-card"><button class="image-button" data-image="assets__contest__robot-chassis.jpg" data-caption="腿履式越障底盘" aria-label="放大腿履式越障底盘"><img src="assets__contest__robot-chassis.jpg" alt="腿履式越障底盘" loading="lazy"></button><figcaption><h3>腿履式越障底盘</h3><p>主履带负责行驶，前端辅助履带可调整角度，为台阶越障和作业支撑提供结构方案。</p></figcaption></figure><figure class="contest-card"><button class="image-button" data-image="assets__contest__robot-lift.jpg" data-caption="剪叉式升降平台" aria-label="放大剪叉式升降平台"><img src="assets__contest__robot-lift.jpg" alt="剪叉式升降平台" loading="lazy"></button><figcaption><h3>剪叉式升降平台</h3><p>采用单段剪叉机构和液压缸，调整上部作业平台高度。设计抬升行程为300 mm。</p></figcaption></figure><figure class="contest-card"><button class="image-button" data-image="assets__contest__robot-arm.jpg" data-caption="机械臂与夹爪" aria-label="放大机械臂与夹爪"><img src="assets__contest__robot-arm.jpg" alt="机械臂与夹爪" loading="lazy"></button><figcaption><h3>机械臂与夹爪</h3><p>多段机械臂搭配末端夹爪，规划抓取、转移和不同姿态下的操作空间。</p></figcaption></figure><figure class="contest-card"><button class="image-button" data-image="assets__contest__robot-excavator.jpg" data-caption="挖掘机构" aria-label="放大挖掘机构"><img src="assets__contest__robot-excavator.jpg" alt="挖掘机构" loading="lazy"></button><figcaption><h3>挖掘机构</h3><p>通过分段动臂和铲斗构成清障机构，并考虑非工作状态下的折叠收纳。</p></figcaption></figure><figure class="contest-card"><button class="image-button" data-image="assets__contest__robot-suspension.jpg" data-caption="悬挂结构" aria-label="放大悬挂结构"><img src="assets__contest__robot-suspension.jpg" alt="悬挂结构" loading="lazy"></button><figcaption><h3>悬挂结构</h3><p>在底盘与机架之间布置弹簧支撑和转动连接，考虑复杂地形中的竖向缓冲。</p></figcaption></figure><figure class="contest-card"><button class="image-button" data-image="assets__contest__robot-vision.jpg" data-caption="视觉模块" aria-label="放大视觉模块"><img src="assets__contest__robot-vision.jpg" alt="视觉模块" loading="lazy"></button><figcaption><h3>视觉模块</h3><p>在前部布置可转动的视觉传感器，并在方案中结合地形与环境探测功能。</p></figcaption></figure></div></div></section><section id="verification"><div class="contest-block section-wrap"><div class="contest-heading"><div><h2>局部结构分析</h2></div><p>说明书包含侧板、铲斗等部件的局部仿真结果，用于辅助讨论结构受载与变形。</p></div><div class="contest-grid"><figure class="contest-card"><button class="image-button" data-image="assets__contest__robot-fea-side.jpg" data-caption="动臂侧板分析" aria-label="放大动臂侧板分析"><img src="assets__contest__robot-fea-side.jpg" alt="动臂侧板分析" loading="lazy"></button><figcaption><h3>动臂侧板分析</h3></figcaption></figure><figure class="contest-card"><button class="image-button" data-image="assets__contest__robot-fea-bucket.jpg" data-caption="铲斗局部分析" aria-label="放大铲斗局部分析"><img src="assets__contest__robot-fea-bucket.jpg" alt="铲斗局部分析" loading="lazy"></button><figcaption><h3>铲斗局部分析</h3></figcaption></figure><figure class="contest-card"><button class="image-button" data-image="assets__contest__robot-fea-plate.jpg" data-caption="侧板局部分析" aria-label="放大侧板局部分析"><img src="assets__contest__robot-fea-plate.jpg" alt="侧板局部分析" loading="lazy"></button><figcaption><h3>侧板局部分析</h3></figcaption></figure></div></div></section></main><footer><a class="identity" href="index.html">丁阳<span>返回作品集首页</span></a><a class="text-link" href="#top">回到顶部 ↑</a></footer><dialog id="lightbox" aria-label="图片放大查看"><div class="lightbox-bar"><p id="lightbox-caption"></p><div><a id="original-link" target="_blank" rel="noopener">打开原图</a><button id="close-lightbox" aria-label="关闭图片">关闭 ×</button></div></div><div class="lightbox-content"><img id="lightbox-image" alt=""></div></dialog><script src="app.js"></script></body></html>
